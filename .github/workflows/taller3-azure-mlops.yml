name: Taller 3 - Azure MLOps Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-build:
    name: Pruebas y build Docker
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: python -m pytest -q
      - name: Autenticarse en GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Generar dataset y entrenar modelo local para imagen Docker
        run: |
          python -m src.data.generate_dataset
          python -m src.training.train
      - name: Construir y publicar imagen Docker
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}-taller3"
          docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:${GITHUB_SHA}" .
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"

  azure-ml-training:
    name: Entrenamiento Azure ML
    runs-on: ubuntu-latest
    needs: test-build
    if: ${{ vars.ENABLE_AZURE_DEPLOY == 'true' }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Instalar extensión Azure ML
        run: |
          az extension add -n ml -y
          az extension update -n ml
      - name: Configurar defaults Azure ML
        run: |
          az configure --defaults group=${{ secrets.AZURE_RESOURCE_GROUP }} workspace=${{ secrets.AZURE_ML_WORKSPACE }} location=${{ secrets.AZURE_LOCATION }}
      - name: Enviar job de entrenamiento a Azure ML
        run: az ml job create --file azureml/train-job.yml --stream
